<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☤𝐁.𝐃.𝐂.𝐒 𝐎𝐅𝐅𝐈𝐂𝐈𝐀𝐋 𖤓 𝐂𝐘𝐁𝐄𝐑 𝐒𝐄𝐂𝐔𝐈𝐑𝐈𝐓𝐘🔰</title>
  <style>
    :root {
      --neon-green: #00ff66;
      --gold: #d4af37;
      --black: #050505;
      --dark-card: rgba(8, 12, 8, 0.90);
      --text: #00ff66;
      --text-dim: #a0ffa0;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      background-color: var(--black);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Video Element */
    #bgVideo {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -3;
      object-fit: cover;
      filter: brightness(0.35) contrast(1.2);
    }

    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: -2;
    }

    /* Matrix Rain Canvas */
    #matrixCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.25;
      pointer-events: none;
    }

    /* Hacker Intro Screen Overlay */
    #introScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(3, 5, 3, 0.96);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      transition: opacity 1s cubic-bezier(0.19, 1, 0.22, 1), visibility 1s ease;
    }

    #introScreen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 10000;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
    }

    .intro-terminal {
      max-width: 700px;
      width: 100%;
      border: 1px solid rgba(0, 255, 102, 0.3);
      padding: 30px;
      background: rgba(0, 10, 2, 0.85);
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.2), inset 0 0 15px rgba(0, 255, 102, 0.1);
      border-radius: 8px;
      position: relative;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(0, 255, 102, 0.3);
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #88ffaa;
    }

    .glitch-text {
      font-size: 18px;
      font-weight: bold;
      color: var(--neon-green);
      text-shadow: 0 0 8px var(--neon-green);
      margin-bottom: 30px;
      min-height: 140px;
      line-height: 1.8;
      text-align: left;
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 18px;
      background-color: var(--neon-green);
      animation: blink 0.8s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .enter-btn {
      position: relative;
      padding: 16px 40px;
      background: rgba(0, 255, 102, 0.05);
      color: var(--neon-green);
      border: 2px solid var(--neon-green);
      border-radius: 4px;
      font-size: 18px;
      font-weight: bold;
      font-family: 'Courier New', Courier, monospace;
      cursor: pointer;
      letter-spacing: 3px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      visibility: hidden;
      transform: translateY(30px) scale(0.9);
      outline: none;
      overflow: hidden;
    }

    .enter-btn.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      animation: pulseBtn 2s infinite alternate;
    }

    @keyframes pulseBtn {
      0% { box-shadow: 0 0 15px rgba(0, 255, 102, 0.4); }
      100% { box-shadow: 0 0 35px rgba(0, 255, 102, 0.9), inset 0 0 15px rgba(0, 255, 102, 0.4); }
    }

    .enter-btn:hover {
      background-color: var(--neon-green);
      color: var(--black);
      box-shadow: 0 0 40px var(--neon-green);
      transform: scale(1.05);
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 20px;
      padding: 30px;
      background-color: var(--dark-card);
      border: 1px solid var(--neon-green);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.25), inset 0 0 15px rgba(0, 255, 102, 0.1);
      backdrop-filter: blur(8px);
      box-sizing: border-box;
      position: relative;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.8s ease, transform 0.8s ease;
      display: none;
    }

    .container.active {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      width: 100%;
    }

    .logo-wrapper {
      position: relative;
      display: inline-block;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 5px;
      border: 2px dashed var(--neon-green);
      box-sizing: border-box;
      overflow: hidden;
      background-color: #000;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      box-shadow: 0 0 15px var(--neon-green);
    }

    .logo-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green);
      animation: scanLogo 2.5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes scanLogo {
      0% { top: 5%; opacity: 0.2; }
      50% { opacity: 1; }
      100% { top: 90%; opacity: 0.2; }
    }

    h1 {
      text-align: center;
      color: var(--neon-green);
      margin-bottom: 5px;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.8), 0 0 20px rgba(0, 255, 102, 0.4);
    }

    p.subtitle {
      text-align: center;
      color: #88ffaa;
      font-size: 13px;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .rules-section {
      background-color: rgba(0, 20, 5, 0.85);
      border-left: 4px solid var(--neon-green);
      border-right: 1px solid rgba(0, 255, 102, 0.2);
      padding: 18px 20px;
      border-radius: 6px;
      margin-bottom: 25px;
      box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.05);
    }

    .rules-section h3 {
      margin-top: 0;
      color: var(--neon-green);
      font-size: 15px;
      text-shadow: 0 0 5px var(--neon-green);
      margin-bottom: 12px;
    }

    .rules-typing-box {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.7;
      min-height: 180px;
      white-space: pre-wrap;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--neon-green);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="tel"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #005522;
      background-color: rgba(0, 15, 5, 0.9);
      color: #00ff66;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
      font-family: 'Courier New', Courier, monospace;
      outline: none;
      transition: all 0.3s;
    }

    input:focus, textarea:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
    }

    textarea {
      resize: vertical;
      height: 80px;
    }

    .radio-group {
      display: flex;
      gap: 15px;
    }

    .radio-option {
      flex: 1;
    }

    .radio-option input[type="radio"] {
      display: none;
    }

    .radio-option label {
      display: block;
      text-align: center;
      padding: 10px;
      background-color: rgba(0, 15, 5, 0.9);
      border: 1px solid #005522;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-dim);
      transition: all 0.3s;
      font-weight: bold;
    }

    .radio-option input[type="radio"]:checked + label {
      background-color: var(--neon-green);
      color: var(--black);
      font-weight: bold;
      border-color: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green);
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }

    .file-input-btn {
      border: 1px dashed var(--neon-green);
      color: var(--neon-green);
      background-color: rgba(0, 15, 5, 0.9);
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
      cursor: pointer;
      display: block;
      transition: all 0.3s;
      font-family: 'Courier New', Courier, monospace;
    }

    .file-input-btn:hover {
      background-color: rgba(0, 35, 10, 0.9);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    }

    .file-input-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      height: 100%;
      width: 100%;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: transparent;
      color: var(--neon-green);
      border: 2px solid var(--neon-green);
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      font-family: 'Courier New', Courier, monospace;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 15px;
      letter-spacing: 2px;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
    }

    .submit-btn:hover {
      background-color: var(--neon-green);
      color: var(--black);
      box-shadow: 0 0 20px var(--neon-green);
    }

    /* Social Link Buttons Style */
    .social-links {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(0, 255, 102, 0.2);
    }

    .social-links a {
      flex: 1;
      text-align: center;
      padding: 10px 5px;
      border: 1px solid var(--neon-green);
      border-radius: 4px;
      background-color: rgba(0, 15, 5, 0.8);
      color: var(--neon-green);
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.3s;
    }

    .social-links a:hover {
      background-color: var(--neon-green);
      color: var(--black);
      box-shadow: 0 0 10px var(--neon-green);
    }
  </style>
</head>

  <script>
    let audioPlayed = false;
    function speakHackerVoice() {
      if ('speechSynthesis' in window && !audioPlayed) {
        window.speechSynthesis.cancel();
        const textToSpeak = "WELCOME TO BLACK TIGER CYBER UNIT. THIS TEAM OWNER MUHAMMAD TONMOY. C.E.O IMRAN MALLIK.";
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.rate = 0.88;
        utterance.pitch = 0.8;
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
        audioPlayed = true;
      }
    }

    function enableVoiceAudio() {
      speakHackerVoice();
    }

    /* Matrix Rain Canvas */
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = [];
    for (let x = 0; x < columns; x++) drops[x] = 1;

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#00ff66";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    /* Intro Typewriter Script */
    const textSequence = [
      "      আসসালামু আলাইকুম",
      " WELCOME TO ☤𝐁.𝐃.𝐂.𝐒 𝐎𝐅𝐅𝐈𝐂𝐈𝐀𝐋 𖤓 𝐂𝐘𝐁𝐄𝐑 𝐒𝐄𝐂𝐔𝐈𝐑𝐈𝐓𝐘🔰",
      " TEAM OWNER: MUHAMMAD APON",
      " TEAM CEO: MD. FAHIM",
      " TEAM CEO: MD TONMOY",
      " TEAM CEO: DX NILOY",
      " HELLO WORLD, I'M ☤𝐁.𝐃.𝐂.𝐒 𝐎𝐅𝐅𝐈𝐂𝐈𝐀𝐋 𖤓 𝐂𝐘𝐁𝐄𝐑 𝐒𝐄𝐂𝐔𝐈𝐑𝐈𝐓𝐘🔰"
    ];

    const typewriterElement = document.getElementById('typewriterText');
    const enterBtn = document.getElementById('enterBtn');
    let lineIndex = 0, charIndex = 0;

    function typeLine() {
      if (lineIndex < textSequence.length) {
        let currentLine = textSequence[lineIndex];
        if (charIndex < currentLine.length) {
          typewriterElement.innerHTML += currentLine.charAt(charIndex);
          charIndex++;
          setTimeout(typeLine, 35);
        } else {
          typewriterElement.innerHTML += "<br>";
          lineIndex++;
          charIndex = 0;
          setTimeout(typeLine, 280);
        }
      } else {
        enterBtn.classList.add('show');
      }
    }

    /* Rules Sequence */
    const teamRules = [
      "1. 🔒 [গোপনীয়তা ও তথ্য সুরক্ষা] -এর সকল তথ্য সম্পূর্ণ গোপনীয়।",
      "2. 🫡 [সম্মান ও পেশাদার আচরণ] প্রতিটি সদস্যকে অ্যাডমিন ও সহকর্মীদের প্রতি সর্বোচ্চ সম্মান বজায় রাখতে হবে।",
      "3. ⚖️ [আইন, নৈতিকতা ও দায়িত্ব] কোনো অবৈধ বা ক্ষতিকর কার্যক্রম পরিচালনা করা সম্পূর্ণ নিষিদ্ধ।",
      "4. 📚 [সক্রিয়তা ও দক্ষতা উন্নয়ন] নিয়মিত প্রজেক্ট ও কার্যক্রমে অংশ নিতে হবে।",
      "5. 🛡️ [অনুমতি ও অফিসিয়াল কার্যক্রম] অননুমোদিত প্রচার নিষিদ্ধ।",
      "6. 💻 [রিসোর্সের সঠিক ব্যবহার] টিমের সম্পদ ব্যক্তিগত কাজে ব্যবহার করা যাবে না।",
      "7. 🤝 [ঐক্য ও সহযোগিতা] টিমের উন্নয়নের জন্য একসাথে কাজ করতে হবে।",
      "8. 🚫 [প্রতারণা নিষিদ্ধ] টিমের পরিচয় ব্যবহার করে অর্থ সংগ্রহ বা ভুয়া পরিচয় প্রদান নিষিদ্ধ।",
      "9. 📢 [যোগাযোগের শৃঙ্খলা] স্প্যামিং বা গুজব ছড়ানো যাবে না।",
      "10. ⚠️ [শাস্তিমূলক ব্যবস্থা] নিয়ম ভাঙলে তাৎক্ষণিক সাময়িক/স্থায়ী বাতিল করা হবে।"
    ];

    const rulesTextElement = document.getElementById('rulesText');
    let rLineIndex = 0, rCharIndex = 0;

    function startRulesTyping() {
      if (rLineIndex < teamRules.length) {
        let currentRule = teamRules[rLineIndex];
        if (rCharIndex < currentRule.length) {
          rulesTextElement.innerHTML += currentRule.charAt(rCharIndex);
          rCharIndex++;
          setTimeout(startRulesTyping, 12);
        } else {
          rulesTextElement.innerHTML += "<br><br>";
          rLineIndex++;
          rCharIndex = 0;
          setTimeout(startRulesTyping, 120);
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        typeLine();
        speakHackerVoice();
      }, 500);
    });

    function enterSystem() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      const intro = document.getElementById('introScreen');
      const mainForm = document.getElementById('mainContainer');
      intro.style.opacity = '0';
      intro.style.visibility = 'hidden';
      setTimeout(() => {
        intro.style.display = 'none';
        mainForm.classList.add('active');
        startRulesTyping();
      }, 500);
    }

    /* File Input Text Change Functions */
    function updateFileName(input) {
      const fileLabel = document.getElementById('fileLabel');
      if (input.files && input.files[0]) {
        fileLabel.innerText = "ছবি: " + input.files[0].name;
      }
    }

    function updateNidFileName(input) {
      const nidFileLabel = document.getElementById('nidFileLabel');
      if (input.files && input.files[0]) {
        nidFileLabel.innerText = "NID/সনদ: " + input.files[0].name;
      }
    }

    async function getServerCredentials() {
      try {
        const response = await fetch('server.txt');
        if (!response.ok) throw new Error('server.txt পাওয়া যায়নি');
        const text = await response.text();
        const credentials = {};
        text.split('\n').forEach(line => {
          const parts = line.split('=');
          if (parts.length === 2) credentials[parts[0].trim()] = parts[1].trim();
        });
        return credentials;
      } catch (error) {
        console.error("Credentials error:", error);
        return null;
      }
    }

    /* Form Fast Submit Function */
    document.getElementById('joinForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "SENDING DATA...";
      submitBtn.disabled = true;

      try {
        const creds = await getServerCredentials();
        if (!creds || !creds.BOT_TOKEN || !creds.CHAT_ID) {
          alert('server.txt থেকে Token বা Chat ID পাওয়া যায়নি!');
          return;
        }

        const BOT_TOKEN = creds.BOT_TOKEN;
        const CHAT_ID = creds.CHAT_ID;

        const name = document.getElementById('name').value;
        const age = document.getElementById('age').value;
        const dob = document.getElementById('dob').value;
        const address = document.getElementById('address').value;
        const currentAddress = document.getElementById('current_address').value;
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        const prevTeam = document.querySelector('input[name="previous_team"]:checked').value;
        const reason = document.getElementById('reason').value;

        const photoInput = document.getElementById('photo');
        const nidPhotoInput = document.getElementById('nidPhoto');

        const captionMessage = 
`🔥 ☤𝐁.𝐃.𝐂.𝐒 𝐎𝐅𝐅𝐈𝐂𝐈𝐀𝐋 𖤓 𝐂𝐘𝐁𝐄𝐑 𝐒𝐄𝐂𝐔𝐈𝐑𝐈𝐓𝐘🔰 🔥

👤 নাম: ${name}
🎂 বয়স: ${age}
📅 জন্ম তারিখ: ${dob}
🏠 স্থায়ী ঠিকানা: ${address}
📍 বর্তমান ঠিকানা: ${currentAddress}
📞 মোবাইল: ${phone}
✉️ ইমেইল: ${email}
🛡️ আগে কোনো টিমে ছিলেন: ${prevTeam}
📝 কারণ: ${reason}`;

        // প্যারালাল প্রসেসিংয়ের মাধ্যমে দ্রুত রিকোয়েস্ট পাঠানো
        const sendRequests = [];

        // ১. ছবিসহ বা সাধারণ টেক্সট পাঠানো
        if (photoInput.files && photoInput.files[0]) {
          const formData = new FormData();
          formData.append("chat_id", CHAT_ID);
          formData.append("caption", captionMessage);
          formData.append("photo", photoInput.files[0]);

          sendRequests.push(fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData
          }));
        } else {
          sendRequests.push(fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, text: captionMessage })
          }));
        }

        // ২. NID / জন্ম সনদ ফাইল থাকলে আলাদা ফটো রিকোয়েস্ট যুক্ত করা
        if (nidPhotoInput.files && nidPhotoInput.files[0]) {
          const nidFormData = new FormData();
          nidFormData.append("chat_id", CHAT_ID);
          nidFormData.append("caption", `🆔 NID / জন্ম সনদ Document: ${name}`);
          nidFormData.append("photo", nidPhotoInput.files[0]);

          sendRequests.push(fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: "POST",
            body: nidFormData
          }));
        }

        // সব রিকোয়েস্ট একসাথে দ্রুত এক্সিকিউট করা (Fast Send)
        const responses = await Promise.all(sendRequests);
        const results = await Promise.all(responses.map(res => res.json()));

        const allSuccess = results.every(res => res.ok);

        if (allSuccess) {
          alert('আপনার আবেদন সফলভাবে জমা দেওয়া হয়েছে!');
          document.getElementById('joinForm').reset();
          document.getElementById('fileLabel').innerText = "📸 ছবি তুলে দিন / পিক আপলোড করুন";
          document.getElementById('nidFileLabel').innerText = "🆔 NID / জন্ম সনদ ছবি তুলে দিন";
        } else {
          alert('আবেদন পাঠাতে কোনো একটি ধাপে সমস্যা হয়েছে। টেলিগ্রাম বট কনফিগারেশন চেক করুন!');
        }

      } catch (error) {
        console.error("Error:", error);
        alert('নেটওয়ার্ক বা সার্ভারে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
      } finally {
        submitBtn.innerText = "EXECUTE // JOIN NOW";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
